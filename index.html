<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacaciones</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --primary:#2563eb; --primary-dark:#1d4ed8;
    --ok:#16a34a; --warn:#f59e0b; --err:#dc2626; --bday:#a855f7; --holiday:#fee2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .page{max-width:1280px;margin:0 auto;padding:24px}
  .page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
  .page-header h1{margin:4px 0 0;font-size:28px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:14px;text-decoration:none}
  .back svg{width:16px;height:16px}
  .back:hover{color:var(--primary)}
  button{font:inherit;cursor:pointer}
  .btn-primary,.btn-next{background:var(--primary);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600}
  .btn-primary:hover,.btn-next:hover{background:var(--primary-dark)}
  .btn-cancel{background:#fff;border:1px solid var(--border);padding:10px 18px;border-radius:8px}
  .btn-cancel:hover{background:#f3f4f6}
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .split-card{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:28px}
  @media(max-width:900px){.split-card{grid-template-columns:1fr}}

  /* Calendario */
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal-month-label{font-weight:700;font-size:18px}
  .page-btn{min-width:32px;height:32px;border:1px solid var(--border);background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
  .page-btn:hover:not(:disabled){background:#f3f4f6}
  .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .page-btn:disabled{opacity:.4;cursor:default}
  .cal-days-header,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-day-name{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
  .cal-cell{position:relative;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:1px solid transparent}
  .cal-cell:hover{background:#eef2ff}
  .cal-cell.other{color:#c0c4cc}
  .cal-cell.weekend{background:#f9fafb;color:var(--muted)}
  .cal-cell.holiday{background:var(--holiday);color:#b91c1c}
  .cal-cell.approved{background:#dcfce7}
  .cal-cell.myVacsApproved{background:#bbf7d0;font-weight:700;color:#14532d}
  .cal-cell.today{border-color:var(--primary);font-weight:700}
  .cal-cell.selected{background:var(--primary);color:#fff}
  .cal-cell-dots{position:absolute;bottom:4px;display:flex;gap:3px}
  .cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .cal-dot-aprobada{background:var(--ok)}
  .cal-dot-pendiente{background:var(--warn)}
  .cal-dot-rechazada{background:var(--err)}
  .cal-dot-birthday{background:var(--bday)}
  .legend-card{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0;font-size:12px;color:var(--muted)}
  .legend-item{display:inline-flex;align-items:center;gap:6px}
  .legend-swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  .legend-swatch.legend-holiday{border-radius:3px;background:var(--holiday);border:1px solid #fca5a5}

  /* Panel día */
  .vac-day-panel{border-top:1px solid var(--border);padding-top:14px}
  .vac-day-title{font-weight:700;text-transform:capitalize;margin-bottom:8px}
  .vac-day-empty{color:var(--muted);font-size:14px;margin:6px 0}
  .vac-day-section{margin-bottom:14px}
  .form-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .holiday-box{background:var(--holiday);color:#b91c1c;padding:8px 12px;border-radius:8px;font-weight:600}
  .birthday-box{background:#f3e8ff;color:#7e22ce;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-weight:600}
  .vac-event-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .vac-event-row:last-child{border-bottom:0}
  .vac-event-name{font-weight:600}
  .vac-event-meta{font-size:13px;color:var(--muted)}
  .vac-event-meta p{margin:2px 0 0}
  .vac-event-comment{font-size:13px;font-style:italic;margin-top:2px}

  /* Badge */
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;height:fit-content}
  .badge-aprobada{background:#dcfce7;color:#166534}
  .badge-pendiente{background:#fef3c7;color:#92400e}
  .badge-rechazada{background:#fee2e2;color:#991b1b}

  /* Filtros y tabla */
  .filters-fields-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:10px 0}
  .form-group{display:flex;flex-direction:column;gap:4px}
  .label-form{font-size:13px;font-weight:600}
  .label-required{color:var(--err)}
  .inp-form{padding:9px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;background:#fff;width:100%}
  .inp-form:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
  textarea.inp-form{min-height:80px;resize:vertical}
  .filters-count{font-size:13px;color:var(--muted)}
  .filters-count span{color:var(--text);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:2px solid var(--border)}
  td{padding:10px 8px;border-bottom:1px solid var(--border)}
  .total-hours-lbl{font-weight:700}
  .total-hours{font-weight:700;color:var(--primary)}
  .action-btn{border:0;background:transparent;padding:6px;border-radius:6px;color:var(--muted)}
  .action-btn svg{width:18px;height:18px}
  .action-btn.delete:hover{background:#fee2e2;color:var(--err)}
  .pagination{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .empty-state{text-align:center;color:var(--muted);padding:40px 0}

  /* Modal */
  .ntfy-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .ntfy-modal-overlay[hidden]{display:none}
  .modal-card{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:520px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
  .form-row.col-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-card .form-group{margin-bottom:12px}
  .form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .footer-hint{font-size:12px;color:var(--muted)}
  .footer-hint span{color:var(--err)}
  .footer-btns{display:flex;gap:8px}
  .alert-msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600}
  .alert-ok{background:#dcfce7;color:#166534}
  .alert-err{background:#fee2e2;color:#991b1b}
  #toast{position:fixed;top:16px;right:16px;z-index:60}
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <a class="back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Volver
      </a>
      <h1>Vacaciones TEST</h1>
    </div>
    <button class="btn-primary" id="btnNueva">+ Nueva solicitud</button>
  </div>

  <div class="form-card">
    <div class="split-card">

      <!-- Calendario + panel del día -->
      <div class="vac-calendar-card">
        <div class="cal-header">
          <button class="page-btn" id="prevMonth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="cal-month-label" id="monthLabel"></span>
          <button class="page-btn" id="nextMonth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="cal-days-header" id="daysHeader"></div>
        <div class="cal-grid" id="calGrid"></div>

        <div class="legend-card">
          <span class="legend-item"><span class="legend-swatch cal-dot-aprobada"></span>Mis Vacaciones</span>
          <span class="legend-item"><span class="legend-swatch cal-dot-pendiente"></span>Pendientes</span>
          <span class="legend-item"><span class="legend-swatch cal-dot-birthday"></span>Cumpleaños</span>
          <span class="legend-item"><span class="legend-swatch legend-holiday"></span>Festivos</span>
        </div>

        <div class="vac-day-panel" id="dayPanel"></div>
      </div>

      <!-- Tabla de solicitudes -->
      <div class="list-panel">
        <span class="form-section-title">Mis solicitudes de vacaciones</span>
        <div class="filters-fields-row">
          <div class="form-group"><label class="label-form">Desde</label><input type="date" class="inp-form" id="fDesde"></div>
          <div class="form-group"><label class="label-form">Hasta</label><input type="date" class="inp-form" id="fHasta"></div>
          <div class="form-group"><label class="label-form">Estado</label>
            <select class="inp-form" id="fEstado">
              <option value="">Todos</option>
              <option value="Aprobada">Aprobada</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Rechazada">Rechazada</option>
            </select>
          </div>
          <div class="form-group"><button type="button" class="btn-cancel" id="btnLimpiar">Limpiar</button></div>
        </div>
        <p class="filters-count" id="filtersCount"></p>
        <div id="tableWrap"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Modal nueva solicitud -->
<div class="ntfy-modal-overlay" id="modal" hidden>
  <div class="modal-card">
    <div id="modalAlert"></div>
    <div class="form-section-title">Nueva solicitud de vacaciones</div>
    <div class="form-row col-2">
      <div class="form-group"><label class="label-form">Fecha inicio <span class="label-required">*</span></label><input type="date" class="inp-form" id="mInicio"></div>
      <div class="form-group"><label class="label-form">Fecha fin <span class="label-required">*</span></label><input type="date" class="inp-form" id="mFin"></div>
    </div>
    <div class="form-group"><label class="label-form">Días <span class="label-required">*</span></label><input type="number" min="0" class="inp-form" id="mDias" value="0"></div>
    <div class="form-group"><label class="label-form">Comentarios</label><textarea class="inp-form" id="mComent" placeholder="Opcional..."></textarea></div>
    <div class="form-footer">
      <span class="footer-hint"><span>*</span> Campos obligatorios</span>
      <div class="footer-btns">
        <button type="button" class="btn-cancel" id="mCancel">Cancelar</button>
        <button type="button" class="btn-next" id="mSend">Enviar solicitud</button>
      </div>
    </div>
  </div>
</div>

<script>
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

const HOLIDAYS = [
  { date:'2026-01-01', name:'Año Nuevo' },
  { date:'2026-01-06', name:'Reyes' },
  { date:'2026-04-03', name:'Viernes Santo' },
  { date:'2026-05-01', name:'Día del Trabajador' },
  { date:'2026-12-25', name:'Navidad' },
];
const BIRTHDAYS = [
  { date:'2026-04-15', name:'Juan Cuesta',     label:'Cumpleaños' },
  { date:'2026-04-22', name:'Belén López',     label:'Cumpleaños' },
  { date:'2026-05-10', name:'Mauricio Hidalgo',label:'Cumpleaños' },
];
const EMPLEADOS = [
  { PkIntIdEmpleado:3, VcNombre:'Emilio Delgado' },
  { PkIntIdEmpleado:4, VcNombre:'Juan Cuesta' },
  { PkIntIdEmpleado:5, VcNombre:'Belén López' },
  { PkIntIdEmpleado:6, VcNombre:'Mauricio Hidalgo' },
  { PkIntIdEmpleado:7, VcNombre:'Vicenta Benito' },
  { PkIntIdEmpleado:8, VcNombre:'Marisa Benito' },
];

const fmtDate = d => { if (!d) return '—'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const toDateStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = toDateStr(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

const currentUserId = 4;
const FILAS_POR_PAGINA = 10;

let vacaciones = [
  { PkIntIdImputacion:1, FkIntIdEmpleado:4, DtFechaInicio:'2026-04-07', DtFechaFin:'2026-04-11', IntDias:5, VcComentarios:'Semana Santa',       VcMotivoRechazo:'', VcEstado:'Aprobada'  },
  { PkIntIdImputacion:2, FkIntIdEmpleado:5, DtFechaInicio:'2026-04-07', DtFechaFin:'2026-04-10', IntDias:4, VcComentarios:'Vacaciones familia', VcMotivoRechazo:'', VcEstado:'Aprobada'  },
  { PkIntIdImputacion:3, FkIntIdEmpleado:6, DtFechaInicio:'2026-04-07', DtFechaFin:'2026-04-08', IntDias:2, VcComentarios:'',                   VcMotivoRechazo:'', VcEstado:'Pendiente' },
  { PkIntIdImputacion:4, FkIntIdEmpleado:4, DtFechaInicio:'2026-05-01', DtFechaFin:'2026-05-08', IntDias:8, VcComentarios:'Viaje verano',       VcMotivoRechazo:'', VcEstado:'Pendiente' },
  { PkIntIdImputacion:5, FkIntIdEmpleado:7, DtFechaInicio:'2026-04-14', DtFechaFin:'2026-04-17', IntDias:4, VcComentarios:'Viaje',              VcMotivoRechazo:'', VcEstado:'Aprobada'  },
];
let nextId = 7;
let calDate = new Date(2026, 3, 1);
let selected = null;
let pagina = 1;

const misVacaciones = () => vacaciones.filter(v => v.FkIntIdEmpleado === currentUserId);
const inRange = (date, v) => date >= v.DtFechaInicio && date <= v.DtFechaFin;
const vacsOn = date => vacaciones.filter(v => inRange(date, v));
const myVacsOn = date => misVacaciones().filter(v => inRange(date, v));
const getHoliday = ds => HOLIDAYS.find(h => h.date === ds);
const getBirthdays = ds => BIRTHDAYS.filter(b => b.date === ds);
const badge = estado => `<span class="badge badge-${esc((estado||'').toLowerCase())}">${esc(estado)}</span>`;

function showToast(msg, type='ok'){
  const el = $('modalAlert');
  const html = `<div class="alert-msg alert-${type}">${esc(msg)}</div>`;
  if (!$('modal').hidden) { el.innerHTML = html; } else { $('toast').innerHTML = html; }
  setTimeout(() => { el.innerHTML = ''; $('toast').innerHTML = ''; }, 3000);
}

/* ---------- Calendario ---------- */
function renderCalendar(){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  $('monthLabel').textContent = `${MONTHS[month]} ${year}`;
  $('daysHeader').innerHTML = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');

  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDow-1; i >= 0; i--) cells.push({ date:new Date(year, month-1, prevMonthDays-i), other:true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ date:new Date(year, month, d), other:false });
  const rem = (firstDow + daysInMonth) % 7;
  if (rem > 0) for (let d = 1; d <= 7-rem; d++) cells.push({ date:new Date(year, month+1, d), other:true });

  $('calGrid').innerHTML = cells.map(({date, other}) => {
    const ds = toDateStr(date);
    const vacs = vacsOn(ds), myVacs = myVacsOn(ds), bdays = getBirthdays(ds);
    const isSel = ds === selected;
    const cls = ['cal-cell',
      other && 'other',
      ds === todayStr && 'today',
      isSel && 'selected',
      vacs.some(v => v.VcEstado === 'Aprobada') && 'approved',
      (date.getDay() === 0 || date.getDay() === 6) && 'weekend',
      getHoliday(ds) && 'holiday',
      myVacs.some(v => v.VcEstado === 'Aprobada') && 'myVacsApproved',
    ].filter(Boolean).join(' ');
    let dots = '';
    if ((vacs.length || bdays.length) && !isSel) {
      dots = '<div class="cal-cell-dots">' +
        vacs.slice(0,2).map(v => `<span class="cal-dot cal-dot-${esc(v.VcEstado.toLowerCase())}"></span>`).join('') +
        (bdays.length ? '<span class="cal-dot cal-dot-birthday"></span>' : '') + '</div>';
    }
    return `<div class="${cls}" data-date="${ds}">${date.getDate()}${dots}</div>`;
  }).join('');

  document.querySelectorAll('.cal-cell').forEach(c => c.addEventListener('click', () => {
    selected = c.dataset.date; renderCalendar(); renderDayPanel();
  }));
}

function renderDayPanel(){
  const p = $('dayPanel');
  if (!selected) {
    p.innerHTML = `<div class="vac-day-title">Selecciona un día</div>
      <p class="vac-day-empty">Haz clic en un día del calendario para ver los eventos.</p>`;
    return;
  }
  const title = new Date(selected+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const hol = getHoliday(selected), bdays = getBirthdays(selected), vacs = vacsOn(selected);
  let html = `<div class="vac-day-title">${esc(title)}</div>`;
  if (hol) html += `<div class="vac-day-section"><div class="form-section-title">Festivo</div><div class="holiday-box">${esc(hol.name)}</div></div>`;
  if (bdays.length) html += `<div class="vac-day-section"><div class="form-section-title">Cumpleaños</div>` +
    bdays.map(b => `<div class="birthday-box">${esc(b.name)}</div>`).join('') + `</div>`;
  html += `<div class="vac-day-section"><div class="form-section-title">Vacaciones</div>`;
  if (!vacs.length) html += `<p class="vac-day-empty">No hay vacaciones para este día.</p>`;
  html += vacs.map(v => {
    const emp = EMPLEADOS.find(e => e.PkIntIdEmpleado === v.FkIntIdEmpleado);
    return `<div class="vac-event-row">
      <div class="vac-event-info">
        <div class="vac-event-name">${esc(emp?.VcNombre || '—')}</div>
        <div class="vac-event-meta">${fmtDate(v.DtFechaInicio)} — ${fmtDate(v.DtFechaFin)}<p>${v.IntDias} días</p></div>
        ${v.VcComentarios ? `<div class="vac-event-comment">${esc(v.VcComentarios)}</div>` : ''}
      </div>${badge(v.VcEstado)}</div>`;
  }).join('') + `</div>`;
  p.innerHTML = html;
}

/* ---------- Tabla ---------- */
function filtradas(){
  const desde = $('fDesde').value, hasta = $('fHasta').value, estado = $('fEstado').value;
  return misVacaciones().filter(v =>
    (!estado || v.VcEstado === estado) &&
    (!desde || v.DtFechaInicio >= desde) &&
    (!hasta || v.DtFechaFin <= hasta));
}

function renderTable(){
  const list = filtradas();
  const totalPaginas = Math.ceil(list.length / FILAS_POR_PAGINA);
  if (pagina > totalPaginas) pagina = Math.max(1, totalPaginas);
  const pageItems = list.slice((pagina-1)*FILAS_POR_PAGINA, pagina*FILAS_POR_PAGINA);
  const totalDias = list.reduce((s, v) => s + Number(v.IntDias), 0);

  $('filtersCount').innerHTML = `Mostrando <span>${list.length}</span> de ${misVacaciones().length} solicitudes · <span>${totalDias}</span> días totales`;

  if (!list.length) {
    $('tableWrap').innerHTML = `<div class="empty-state">No hay solicitudes con los filtros aplicados</div>`;
    $('pagination').innerHTML = '';
    return;
  }

  $('tableWrap').innerHTML = `<table>
    <thead><tr><th>Inicio</th><th>Fin</th><th>Días</th><th>Comentarios</th><th>Estado</th><th>Motivo rechazo</th><th>Acciones</th></tr></thead>
    <tbody>${pageItems.map(v => `<tr>
      <td>${fmtDate(v.DtFechaInicio)}</td><td>${fmtDate(v.DtFechaFin)}</td><td>${v.IntDias}</td>
      <td>${esc(v.VcComentarios) || '—'}</td><td>${badge(v.VcEstado)}</td><td>${esc(v.VcMotivoRechazo) || '—'}</td>
      <td>${v.VcEstado === 'Pendiente' ? `<button class="action-btn delete" title="Cancelar solicitud" data-del="${v.PkIntIdImputacion}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>` : ''}</td>
    </tr>`).join('')}
    <tr><td class="total-hours-lbl">Total días</td><td colspan="6"><span class="total-hours">${totalDias}d</span></td></tr>
    </tbody></table>`;

  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const id = Number(b.dataset.del);
    vacaciones = vacaciones.filter(v => v.PkIntIdImputacion !== id);
    renderAll();
  }));

  let pg = '';
  if (totalPaginas > 1) {
    pg += `<button class="page-btn" data-pg="${pagina-1}" ${pagina===1?'disabled':''}>‹</button>`;
    for (let n = 1; n <= totalPaginas; n++) pg += `<button class="page-btn ${n===pagina?'active':''}" data-pg="${n}">${n}</button>`;
    pg += `<button class="page-btn" data-pg="${pagina+1}" ${pagina===totalPaginas?'disabled':''}>›</button>`;
  }
  $('pagination').innerHTML = pg;
  document.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => { pagina = Number(b.dataset.pg); renderTable(); }));
}

function renderAll(){ renderCalendar(); renderDayPanel(); renderTable(); }

/* ---------- Eventos ---------- */
$('prevMonth').onclick = () => { calDate = new Date(calDate.getFullYear(), calDate.getMonth()-1, 1); renderCalendar(); };
$('nextMonth').onclick = () => { calDate = new Date(calDate.getFullYear(), calDate.getMonth()+1, 1); renderCalendar(); };

['fDesde','fHasta','fEstado'].forEach(id => $(id).addEventListener('change', () => { pagina = 1; renderTable(); }));
$('btnLimpiar').onclick = () => { $('fDesde').value = ''; $('fHasta').value = ''; $('fEstado').value = ''; pagina = 1; renderTable(); };

function openModal(){ $('modal').hidden = false; $('modalAlert').innerHTML = ''; }
function closeModal(){ $('modal').hidden = true; }
function resetForm(){ $('mInicio').value = ''; $('mFin').value = ''; $('mDias').value = 0; $('mComent').value = ''; }

$('btnNueva').onclick = openModal;
$('mCancel').onclick = closeModal;

$('mSend').onclick = () => {
  const inicio = $('mInicio').value, fin = $('mFin').value;
  const dias = Number($('mDias').value), coment = $('mComent').value;
  if (!inicio || !fin) return showToast('Selecciona fecha de inicio y fin.', 'err');
  if (fin < inicio)    return showToast('La fecha fin debe ser posterior al inicio.', 'err');
  if (!(dias >= 1))    return showToast('Debes de introducir los días', 'err');

  vacaciones.push({
    PkIntIdImputacion: nextId++, FkIntIdEmpleado: currentUserId,
    DtFechaInicio: inicio, DtFechaFin: fin, IntDias: dias,
    VcComentarios: coment, VcMotivoRechazo: '', VcEstado: 'Pendiente',
  });
  resetForm(); closeModal(); renderAll();
  showToast('Solicitud enviada correctamente.');
};

renderAll();
</script>
</body>
</html>
